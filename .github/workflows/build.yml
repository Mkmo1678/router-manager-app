name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          echo "Git commits: $(git rev-list --count HEAD)"
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -nE "^e: |^w: |error:|FAILURE:|What went wrong:|Caused by:|> Task .*FAILED" build_log.txt | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "=== LAST 150 LINES ==="
            tail -150 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: router-manager-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
